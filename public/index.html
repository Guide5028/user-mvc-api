<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Social Login Demo</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f7;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 320px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 24px;
    }
    a.btn {
      display: block;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 600;
      color: white;
    }
    a.google { background: #4285F4; }
    a.facebook { background: #1877F2; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sign in to user-mvc-api</h1>
    <a class="btn google" href="/auth/google">Login with Google</a>
    <a class="btn facebook" href="/auth/facebook">Login with Facebook</a>
  </div>
</body>
</html>
