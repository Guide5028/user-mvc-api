<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Login Success</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f7;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      text-align: center;
      width: 360px;
    }
    h1 { font-size: 20px; margin-bottom: 8px; }
    p { color: #555; margin: 4px 0; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      margin-top: 12px;
    }
    .google { background: #4285F4; }
    .facebook { background: #1877F2; }
    a { color: #4285F4; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="welcome">Welcome!</h1>
    <p id="email"></p>
    <span class="badge" id="provider"></span>
    <p style="margin-top: 20px;"><a href="/">&larr; Back to login</a></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name") || "User";
    const email = params.get("email") || "";
    const provider = params.get("provider") || "";

    document.getElementById("welcome").textContent = `Welcome, ${name}!`;
    document.getElementById("email").textContent = email;
    const badge = document.getElementById("provider");
    badge.textContent = `Logged in via ${provider}`;
    badge.classList.add(provider);
  </script>
</body>
</html>
